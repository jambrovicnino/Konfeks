<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400">
  <defs>
    <!-- Gradient for wrapped candy bodies -->
    <linearGradient id="candyRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e63946"/>
      <stop offset="100%" style="stop-color:#c1121f"/>
    </linearGradient>
    <linearGradient id="candyOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f4a261"/>
      <stop offset="100%" style="stop-color:#e76f51"/>
    </linearGradient>
    <linearGradient id="candyGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6ab04c"/>
      <stop offset="100%" style="stop-color:#27ae60"/>
    </linearGradient>
    <linearGradient id="candyBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#54a0ff"/>
      <stop offset="100%" style="stop-color:#2e86de"/>
    </linearGradient>
    <linearGradient id="candyYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd166"/>
      <stop offset="100%" style="stop-color:#f4b400"/>
    </linearGradient>
    <linearGradient id="candyPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fd79a8"/>
      <stop offset="100%" style="stop-color:#e84393"/>
    </linearGradient>
    <linearGradient id="candyPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a29bfe"/>
      <stop offset="100%" style="stop-color:#6c5ce7"/>
    </linearGradient>
  </defs>

  <!-- Wrapped candy - top left (red) -->
  <g transform="translate(60, 80) rotate(-30)">
    <polygon points="-30,-8 -18,-12 -18,12 -30,8" fill="#e8d4d4" opacity="0.8"/>
    <polygon points="30,-8 18,-12 18,12 30,8" fill="#e8d4d4" opacity="0.8"/>
    <rect x="-18" y="-14" width="36" height="28" rx="6" fill="url(#candyRed)"/>
    <line x1="-6" y1="-14" x2="-6" y2="14" stroke="white" stroke-width="1.5" opacity="0.3"/>
    <line x1="6" y1="-14" x2="6" y2="14" stroke="white" stroke-width="1.5" opacity="0.3"/>
  </g>

  <!-- Wrapped candy - top center (yellow) -->
  <g transform="translate(190, 55) rotate(15)">
    <polygon points="-28,-7 -16,-11 -16,11 -28,7" fill="#f0e6c8" opacity="0.8"/>
    <polygon points="28,-7 16,-11 16,11 28,7" fill="#f0e6c8" opacity="0.8"/>
    <rect x="-16" y="-12" width="32" height="24" rx="5" fill="url(#candyYellow)"/>
    <line x1="-5" y1="-12" x2="-5" y2="12" stroke="white" stroke-width="1.5" opacity="0.3"/>
    <line x1="5" y1="-12" x2="5" y2="12" stroke="white" stroke-width="1.5" opacity="0.3"/>
  </g>

  <!-- Round lollipop - top right (green) -->
  <g transform="translate(350, 65)">
    <rect x="-2" y="16" width="4" height="30" rx="2" fill="#c0a080"/>
    <circle cx="0" cy="0" r="22" fill="url(#candyGreen)"/>
    <path d="M-10,-15 Q0,-20 10,-10 Q15,0 5,10 Q-5,15 -15,5 Q-18,-5 -10,-15" fill="white" opacity="0.15"/>
  </g>

  <!-- Wrapped candy - right side (blue) -->
  <g transform="translate(430, 160) rotate(45)">
    <polygon points="-30,-8 -18,-12 -18,12 -30,8" fill="#d4dce8" opacity="0.8"/>
    <polygon points="30,-8 18,-12 18,12 30,8" fill="#d4dce8" opacity="0.8"/>
    <rect x="-18" y="-14" width="36" height="28" rx="6" fill="url(#candyBlue)"/>
    <line x1="-6" y1="-14" x2="-6" y2="14" stroke="white" stroke-width="1.5" opacity="0.3"/>
    <line x1="6" y1="-14" x2="6" y2="14" stroke="white" stroke-width="1.5" opacity="0.3"/>
  </g>

  <!-- Round candy - left side (orange) -->
  <g transform="translate(40, 200)">
    <circle cx="0" cy="0" r="20" fill="url(#candyOrange)"/>
    <path d="M-8,-14 Q2,-18 10,-8 Q14,2 4,10 Q-6,14 -14,4 Q-16,-6 -8,-14" fill="white" opacity="0.15"/>
  </g>

  <!-- Wrapped candy - bottom left (pink) -->
  <g transform="translate(80, 310) rotate(20)">
    <polygon points="-28,-7 -16,-11 -16,11 -28,7" fill="#f0d4de" opacity="0.8"/>
    <polygon points="28,-7 16,-11 16,11 28,7" fill="#f0d4de" opacity="0.8"/>
    <rect x="-16" y="-12" width="32" height="24" rx="5" fill="url(#candyPink)"/>
    <line x1="-5" y1="-12" x2="-5" y2="12" stroke="white" stroke-width="1.5" opacity="0.3"/>
    <line x1="5" y1="-12" x2="5" y2="12" stroke="white" stroke-width="1.5" opacity="0.3"/>
  </g>

  <!-- Round candy - bottom center (purple) -->
  <g transform="translate(320, 330)">
    <circle cx="0" cy="0" r="18" fill="url(#candyPurple)"/>
    <path d="M-7,-12 Q2,-16 9,-7 Q13,2 4,9 Q-5,13 -12,4 Q-14,-5 -7,-12" fill="white" opacity="0.15"/>
  </g>

  <!-- Wrapped candy - bottom right (green) -->
  <g transform="translate(430, 290) rotate(-15)">
    <polygon points="-26,-7 -15,-10 -15,10 -26,7" fill="#d4e8d8" opacity="0.8"/>
    <polygon points="26,-7 15,-10 15,10 26,7" fill="#d4e8d8" opacity="0.8"/>
    <rect x="-15" y="-11" width="30" height="22" rx="5" fill="url(#candyGreen)"/>
    <line x1="-5" y1="-11" x2="-5" y2="11" stroke="white" stroke-width="1.5" opacity="0.3"/>
    <line x1="5" y1="-11" x2="5" y2="11" stroke="white" stroke-width="1.5" opacity="0.3"/>
  </g>

  <!-- Small candy accents -->
  <circle cx="140" cy="100" r="8" fill="#ffd166" opacity="0.7"/>
  <circle cx="410" cy="100" r="6" fill="#e63946" opacity="0.6"/>
  <circle cx="460" cy="240" r="7" fill="#f4a261" opacity="0.6"/>
  <circle cx="30" cy="280" r="6" fill="#54a0ff" opacity="0.6"/>
  <circle cx="200" cy="340" r="7" fill="#e63946" opacity="0.5"/>
  <circle cx="460" cy="340" r="5" fill="#ffd166" opacity="0.6"/>

  <!-- Main text: Konfeks -->
  <text x="250" y="200" text-anchor="middle" font-family="'Georgia', 'Palatino', serif" font-size="72" font-weight="bold" fill="#2d3436" letter-spacing="3">
    Konfeks
  </text>

  <!-- Subtext: d.o.o. -->
  <text x="250" y="250" text-anchor="middle" font-family="'Georgia', 'Palatino', serif" font-size="32" fill="#636e72" letter-spacing="6">
    d.o.o.
  </text>
</svg>