<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 160" width="480" height="160">
  <defs>
    <linearGradient id="metallic" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e0e0e0"/>
      <stop offset="35%" style="stop-color:#c0c0c0"/>
      <stop offset="50%" style="stop-color:#f5f5f5"/>
      <stop offset="65%" style="stop-color:#b0b0b0"/>
      <stop offset="100%" style="stop-color:#909090"/>
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0ea5e9; stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#38bdf8; stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0ea5e9; stop-opacity:0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Subtle blue glow behind text -->
  <ellipse cx="240" cy="70" rx="200" ry="50" fill="#0ea5e9" opacity="0.06"/>

  <!-- Main text: KONFEKS -->
  <text x="240" y="82" text-anchor="middle" font-family="'Inter', 'Montserrat', 'Arial', sans-serif" font-size="72" font-weight="800" fill="url(#metallic)" letter-spacing="8" filter="url(#glow)">
    KONFEKS
  </text>

  <!-- Blue accent line -->
  <rect x="100" y="98" width="280" height="2" rx="1" fill="url(#blueGlow)" filter="url(#softGlow)"/>

  <!-- Subtext: D.O.O. -->
  <text x="240" y="130" text-anchor="middle" font-family="'Inter', 'Montserrat', 'Arial', sans-serif" font-size="24" font-weight="300" fill="#a0aec0" letter-spacing="14">
    D.O.O.
  </text>

  <!-- Small accent dots -->
  <circle cx="90" cy="99" r="3" fill="#38bdf8" opacity="0.8" filter="url(#softGlow)"/>
  <circle cx="390" cy="99" r="3" fill="#38bdf8" opacity="0.8" filter="url(#softGlow)"/>
</svg>